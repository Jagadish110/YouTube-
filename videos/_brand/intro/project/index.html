<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Outfit'; font-weight: 800; src: url('assets/fonts/outfit-latin-800-normal.woff2') format('woff2'); } @font-face { font-family: 'Plus Jakarta Sans'; font-weight: 500; src: url('assets/fonts/plus-jakarta-sans-latin-500-normal.woff2') format('woff2'); } @font-face { font-family: 'Plus Jakarta Sans'; font-weight: 700; src: url('assets/fonts/plus-jakarta-sans-latin-700-normal.woff2') format('woff2'); }
      :root { --ground: #1B2240; --ink: #FFFFFF; --quiet: #C9CFEA; --up: #FF4A4F; --down: #FF4A4F; --panel: #252D55; --line: #2E3766; --head: 'Outfit', 'Inter', sans-serif; --body: 'Plus Jakarta Sans', 'Inter', sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #bg { position: absolute; inset: 0; background: var(--ground); background-image: radial-gradient(circle at 50% 38%, rgba(255,74,79,0.18) 0, rgba(255,74,79,0) 45%), linear-gradient(rgba(255,255,255,.035) 2px, transparent 2px), linear-gradient(90deg, rgba(255,255,255,.035) 2px, transparent 2px); background-size: auto, 80px 80px, 80px 80px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6.3" data-width="1920" data-height="1080">
      <div id="bg"></div>
      <div id="intro" data-composition-id="intro" data-composition-src="compositions/intro.html" data-start="0.0" data-duration="6.3" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <audio id="vo" class="clip" src="assets/vo.mp3" data-start="0" data-duration="6.0" data-track-index="2" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
